<style>
:root{--bg:#07090c;--surface:#0e1410;--green:#1d3319;--green-2:#2f5a28;--cream:#efe6d2;--muted:#a9a592;--gold:#b58a50;--line:#22301f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#07090c;--surface:#0e1410;--cream:#efe6d2;--muted:#a9a592}}
:root[data-theme="dark"]{--bg:#07090c;--surface:#0e1410;--cream:#efe6d2;--muted:#a9a592}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--cream);font-family:'Tajawal',system-ui,sans-serif;font-weight:300;line-height:1.8}
h1,h2,h3{font-family:'Amiri','Times New Roman',serif;font-weight:400}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.logo{font-family:'Amiri',serif;letter-spacing:.35em;font-size:22px}
.hbtns{display:flex;gap:16px;align-items:center;color:var(--muted);font-size:15px}
.hbtns a:hover,.hbtns button:hover{color:var(--cream)}
.cartbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid #fff;background:#fff;border-radius:999px;padding:6px 16px;color:#07090c;font-weight:700}.cartbtn svg{width:18px;height:18px;flex:none}
.cartbtn b{display:inline-block;min-width:22px;margin-right:6px;background:var(--gold);color:#07090c;border-radius:11px;text-align:center;font-weight:500;font-size:14px}
.view{display:none}.view.on{display:block}
.hero{position:relative;text-align:center;padding:70px 0 90px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:50% auto auto 50%;width:min(560px,90vw);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,var(--green) 0%,rgba(29,51,25,.55) 45%,transparent 70%)}
.hero>*{position:relative}
.mark{font-family:'Amiri',serif;font-size:clamp(76px,22vw,210px);letter-spacing:.12em;line-height:1;direction:ltr;padding-left:.12em}
.hero p{margin-top:14px;font-size:19px;color:var(--muted)}
.btns{margin-top:34px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;padding:12px 30px;border:1px solid var(--gold);color:var(--cream);border-radius:2px;font-size:16px;transition:background .2s}
.btn.fill{background:var(--gold);color:#07090c}
.btn:hover{background:var(--green-2);border-color:var(--green-2);color:var(--cream)}
section{padding:60px 0;border-top:1px solid var(--line)}
h2{font-size:34px;margin-bottom:8px}
.sub{color:var(--muted);margin-bottom:30px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.cat{border:1px solid var(--line);padding:30px 16px;text-align:center;font-family:'Amiri',serif;font-size:22px;background:linear-gradient(180deg,var(--surface),var(--bg));transition:border-color .2s}
.cat:hover{border-color:var(--gold)}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:30px}
.perks h3{font-size:22px;color:var(--gold)}
.perks p{color:var(--muted);font-size:15px}
.aicard{align-items:center;gap:14px;width:100%;margin-bottom:22px;padding:16px 18px;border:1px solid var(--gold);border-radius:18px;background:linear-gradient(135deg,var(--green),#0a120a);text-align:right;transition:transform .2s}.aicard:hover{transform:translateY(-2px)}.aicard .aiic{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:rgba(181,138,80,.18)}.aicard b{display:block;font-family:Amiri,serif;font-size:22px;font-weight:700;color:var(--gold)}.aicard small{color:var(--muted);font-size:13px}.aicard .aiar{margin-right:auto;font-size:22px;color:var(--gold)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.chip{border:1px solid var(--line);padding:5px 20px;color:var(--muted)}
.chip.on{border-color:var(--gold);color:var(--cream);background:var(--green)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);padding:22px 20px 20px;display:flex;flex-direction:column}
.bottle{height:140px;display:grid;place-items:center;background:linear-gradient(160deg,var(--green),#0a120a);margin-bottom:18px}
.bottle i{display:block;width:44px;height:74px;border:1.5px solid var(--cream);border-radius:8px;position:relative}
.bottle i::before{content:"";position:absolute;top:-17px;left:13px;width:14px;height:14px;border:1.5px solid var(--cream);border-bottom:0}
.card h3{font-size:22px}
.card small{color:var(--muted);font-size:14px}
.card .add{margin-top:14px;border:1px solid var(--gold);padding:7px;transition:background .2s}
.card .add:hover{background:var(--gold);color:#07090c}
.step{margin-top:14px;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--gold);border-radius:40px;padding:4px;background:var(--bg)}
.step button{width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1;display:grid;place-items:center;transition:filter .2s}
.step button[data-gp]{background:var(--gold);color:#07090c}
.step button[data-gm]{background:var(--green);color:var(--cream)}
.step button:hover{filter:brightness(1.2)}
.step span{font-family:'Amiri',serif;font-size:22px;min-width:34px;text-align:center}
.back{color:var(--muted);display:inline-block;margin:10px 0 24px}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:20}
.shade.on{display:block}
footer{border-top:1px solid var(--line);padding:40px 0 50px;text-align:center;color:var(--muted)}
footer .logo{color:var(--cream);display:block;margin-bottom:10px}
footer a{color:var(--gold)}
@media (max-width:560px){.hero{padding:40px 0 60px}h2{font-size:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.pimg{height:170px;margin-bottom:14px;background:linear-gradient(160deg,var(--green),#0a120a);display:grid;place-items:center;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.badge{display:inline-block;align-self:flex-start;font-size:12px;padding:0 10px;border:1px solid var(--gold);color:var(--gold);margin-bottom:8px}
.badge.so{border-color:#7a2a2a;color:#ff9a9a}
.desc{color:var(--muted);font-size:14px;margin-top:4px}
.price{margin-top:8px;font-size:18px;color:var(--gold)}
.price s{color:var(--muted);font-size:14px;margin-right:6px}
.sizes{display:flex;gap:8px;margin-top:10px}
.sz{flex:1;border:1px solid var(--line);padding:3px 0;text-align:center;color:var(--muted);font-size:14px}
.sz.on{border-color:var(--gold);color:var(--cream);background:var(--green)}
.card .add[disabled]{opacity:.45;cursor:not-allowed;border-color:var(--line)}
.state{color:var(--muted);text-align:center;padding:50px 0}
.szbtn{margin-top:10px;width:100%;border:1px dashed var(--gold);padding:7px;color:var(--cream);transition:background .2s}
.szbtn:hover{background:var(--green)}
.szbtn.set{border-style:solid;background:var(--green)}
.szbtn.err{border-color:#ff6b6b;animation:shk .3s}
.szerr{color:#ff9a9a;font-size:13px;min-height:0;margin-top:6px}
@keyframes shk{25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
#szModal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px}
#szModal.on{display:flex}
#szModal .box{background:var(--surface);border:1px solid var(--gold);width:min(340px,100%);padding:22px 20px 18px;border-radius:4px}
#szModal h3{font-size:22px;margin-bottom:2px}
#szModal .hint{color:var(--muted);font-size:14px;margin-bottom:14px}
.szopt{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid var(--line);padding:12px 14px;margin-bottom:10px;border-radius:2px;transition:border-color .2s,background .2s}
.szopt:hover{border-color:var(--gold)}
.szopt.on{border-color:var(--gold);background:var(--green)}
.szopt s{color:var(--muted);font-size:13px;margin-left:6px}
.szopt b{font-weight:400;color:var(--gold)}
#szDone{width:100%;margin-top:6px;background:var(--gold);color:#07090c;padding:11px;font-size:17px}
#szDone[disabled]{opacity:.4;cursor:not-allowed}
#szClose{margin-top:8px;width:100%;color:var(--muted);padding:6px}

/* ══ السلة (درج جانبي بـ 3 خطوات) ══ */
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(430px,100%);z-index:30;transform:translateX(-104%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;
  background:linear-gradient(180deg,#0f1a10 0%,var(--surface) 38%,#0a100b 100%);border-right:1px solid var(--gold);
  padding:calc(16px + env(safe-area-inset-top,0px)) 0 calc(14px + env(safe-area-inset-bottom,0px));box-shadow:12px 0 50px rgba(0,0,0,.55)}
.drawer.on{transform:none}
.drawer::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(135deg,rgba(181,138,80,.045) 0 1px,transparent 1px 14px)}
.drawer>*{position:relative}
.dh{display:flex;justify-content:space-between;align-items:center;padding:0 20px}
.dh h2{font-size:25px;margin:0;display:flex;align-items:center;gap:8px}
.dx{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:18px;transition:transform .25s,border-color .2s}
.dx:hover{transform:rotate(90deg);border-color:var(--gold)}
.steps{display:flex;align-items:center;gap:6px;padding:14px 20px 4px;font-size:12px;color:var(--muted)}
.steps i{flex:1;height:2px;background:var(--line);position:relative;overflow:hidden;border-radius:2px}
.steps i::after{content:"";position:absolute;inset:0;background:var(--gold);transform:scaleX(0);transform-origin:right;transition:transform .45s}
.steps i.on::after{transform:scaleX(1)}
.steps b{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:400;font-size:12px;transition:all .3s}
.steps b.on{border-color:var(--gold);background:var(--gold);color:#07090c}
.shimmer{height:1px;margin:12px 20px 0;background:linear-gradient(90deg,transparent,var(--gold),transparent);background-size:200% 100%;animation:shim 3.2s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.vbody{flex:1;overflow:auto;padding:14px 20px 8px}
.foot{padding:12px 20px 0;border-top:1px solid var(--line);background:rgba(7,9,12,.35)}
.view2{display:none;flex-direction:column;flex:1;min-height:0}
.view2.on{display:flex}

.citem{display:flex;gap:12px;align-items:center;padding:12px;margin-bottom:10px;border:1px solid var(--line);background:rgba(14,20,16,.8);border-radius:4px;animation:inUp .35s both}
@keyframes inUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.cbot{width:46px;height:58px;flex:none;display:grid;place-items:center;background:linear-gradient(160deg,var(--green),#0a120a);border:1px solid var(--line)}
.cbot i{display:block;width:18px;height:30px;border:1.5px solid var(--cream);border-radius:4px;position:relative}
.cbot i::before{content:"";position:absolute;top:-8px;left:4px;width:7px;height:7px;border:1.5px solid var(--cream);border-bottom:0}
.cmeta{flex:1;min-width:0}
.cmeta h3{font-size:19px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip2{display:inline-block;font-size:12px;border:1px solid var(--gold);color:var(--gold);padding:0 8px;margin:2px 0}
.cmeta small{color:var(--muted);display:block;font-size:13px}
.cside{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.cstep{display:flex;align-items:center;border:1px solid var(--gold);border-radius:30px;overflow:hidden}
.cstep button{width:28px;height:28px;font-size:17px;line-height:1;display:grid;place-items:center;transition:background .2s}
.cstep button:hover{background:var(--green-2)}
.cstep span{min-width:24px;text-align:center;font-family:'Amiri',serif;font-size:18px}
.crm{font-size:12px;color:#ff9a9a;opacity:.85}
.crm:hover{opacity:1;text-decoration:underline}
.cline{font-size:14px;color:var(--gold)}

.cempty{text-align:center;padding:50px 10px;color:var(--muted)}
.cempty .fb{display:inline-block;width:54px;height:84px;border:2px solid var(--gold);border-radius:10px;position:relative;margin-bottom:26px;animation:flt 3s ease-in-out infinite}
.cempty .fb::before{content:"";position:absolute;top:-19px;left:17px;width:16px;height:16px;border:2px solid var(--gold);border-bottom:0}
.cempty .fb::after{content:"";position:absolute;left:50%;top:-40px;width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:.6;animation:smk 3s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-8px)}}
@keyframes smk{0%{transform:translate(-50%,0);opacity:.7}100%{transform:translate(-20%,-26px);opacity:0}}
.cempty p{margin-bottom:18px}

.ticket{position:relative;margin:14px 0 12px;border:1px dashed var(--gold);border-radius:4px;background:rgba(181,138,80,.06)}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--surface);border:1px dashed var(--gold);transform:translateY(-50%)}
.ticket::before{right:-8px}.ticket::after{left:-8px}
.tk-h{width:100%;padding:11px 18px;display:flex;justify-content:space-between;align-items:center;font-size:15px}
.tk-h span:last-child{transition:transform .25s}
.ticket.open .tk-h span:last-child{transform:rotate(180deg)}
.tk-b{display:none;padding:0 18px 14px}
.ticket.open .tk-b{display:block}
.tk-row{display:flex;gap:8px}
.tk-row input{flex:1;min-width:0;direction:ltr;text-align:center;letter-spacing:.12em;text-transform:uppercase}
.tk-row button{background:var(--gold);color:#07090c;padding:0 16px;border-radius:2px}
.tk-ok{display:flex;justify-content:space-between;align-items:center;padding:11px 18px;color:#9fe29f;font-size:15px}
.tk-ok button{color:#ff9a9a;font-size:13px}
.tk-msg{font-size:13px;margin-top:8px;min-height:18px;color:#ff9a9a}

.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.fld>span em{font-style:normal;opacity:.7}
.fld input,.fld select,.fld textarea,.tk-row input{width:100%;background:var(--bg);color:var(--cream);border:1px solid var(--line);padding:10px 12px;font:inherit;border-radius:2px;transition:border-color .2s}
.fld input:focus,.fld select:focus,.fld textarea:focus,.tk-row input:focus{outline:none;border-color:var(--gold)}
.fld textarea{min-height:64px;resize:vertical}
.fld.bad input,.fld.bad select{border-color:#ff6b6b}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.sum{font-size:15px;color:var(--muted);margin-bottom:8px}
.sum div{display:flex;justify-content:space-between;padding:2px 0}
.sum .dis{color:#9fe29f}
.sum .tot{color:var(--cream);font-size:20px;font-family:'Amiri',serif;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.sum .tot b{font-weight:400;color:var(--gold)}
.go{position:relative;overflow:hidden;width:100%;background:var(--gold);color:#07090c;padding:13px;font-size:18px;border-radius:2px;display:flex;justify-content:center;align-items:center;gap:8px}
.go::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:sw 3.4s ease-in-out infinite}
@keyframes sw{60%,100%{left:130%}}
.go[disabled]{opacity:.55;cursor:wait}
.go2{width:100%;margin-top:8px;padding:9px;color:var(--muted);font-size:15px}
.go2:hover{color:var(--cream)}
.err{color:#ff9a9a;font-size:14px;min-height:20px;margin:0 0 6px;text-align:center}

.done{text-align:center;padding:30px 6px 10px}
.ring{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.ring svg{width:40px;height:40px;stroke:var(--gold);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:dr .5s .35s forwards}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes dr{to{stroke-dashoffset:0}}
.done h3{font-size:26px;margin-bottom:6px}
.done p{color:var(--muted);font-size:15px;margin-bottom:6px}
.ocode{display:inline-flex;align-items:center;gap:10px;margin:14px 0 8px;padding:8px 18px;border:1px dashed var(--gold);font-family:'Amiri',serif;font-size:30px;letter-spacing:.3em;direction:ltr;color:var(--gold)}
.ocode button{font-size:13px;letter-spacing:0;font-family:'Tajawal',sans-serif;color:var(--muted)}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold);pointer-events:none;animation:spk 1.1s ease-out forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy));opacity:0}}
@media (prefers-reduced-motion:reduce){.drawer,.shimmer,.go::after,.cempty .fb,.cempty .fb::after,.ring,.ring svg,.citem{animation:none!important;transition:none!important}.ring svg{stroke-dashoffset:0}}
</style>
</head>

(function(){

  function jget(k,d){try{var v=JSON.parse(localStorage.getItem(k)||'null');return v==null?d:v}catch(e){return d}}

  function normPhone(v){var d=String(v||'').replace(/[^0-9]/g,'');if(/^9647\d{9}$/.test(d))return '0'+d.slice(3);if(/^07\d{9}$/.test(d))return d;if(/^7\d{9}$/.test(d))return '0'+d;return null}

  '@keyframes omIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}'+

  '#omModal .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}'+

  '#omModal .sb{width:100%;padding:10px;margin-top:8px;border:1px solid var(--gold,#b58a50);background:none;color:var(--cream,#efe6d2);font:inherit;border-radius:4px;cursor:pointer}'+
  '#omModal .ms{margin-top:10px;min-height:20px;font-size:14px;color:var(--muted,#a9a592)}#omModal .ms.ok{color:#9fe29f}#omModal .ms.bad{color:#ff9a9a}'+
  '#omModal .gs{display:flex;gap:10px;margin-bottom:12px}#omModal .gs button{flex:1;padding:9px;border:1px solid var(--line,#22301f);background:none;color:var(--muted,#a9a592);font:inherit;border-radius:4px;cursor:pointer}'+
  '#omModal .gs button.on{border-color:var(--gold,#b58a50);color:var(--cream,#efe6d2);background:var(--green,#1d3319)}'+
  '#omModal .rvl{max-height:210px;overflow:auto;margin-bottom:14px;display:grid;gap:8px}'+
  '#omModal .rv1{border:1px solid var(--line,#22301f);border-radius:6px;padding:10px 12px;background:rgba(255,255,255,.02)}#omModal .rv1 b{display:block;color:var(--gold,#b58a50);font-weight:700;margin-bottom:2px}#omModal .rv1 p{margin:0;font-size:14px;word-break:break-word}'+
  '#omModal .chat{height:min(46vh,340px);overflow:auto;display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line,#22301f);border-radius:8px;background:var(--bg,#07090c);margin-bottom:10px}'+
  '#omModal .m{max-width:82%;padding:8px 12px;border-radius:14px;font-size:15px;line-height:1.7;word-break:break-word;animation:omIn .2s}'+
  '#omModal .m small{display:block;font-size:11px;opacity:.65;margin-top:2px}'+
  '#omModal .m.u{align-self:flex-start;background:var(--gold,#b58a50);color:#07090c;border-bottom-right-radius:4px}'+
  '#omModal .m.a{align-self:flex-end;background:var(--green,#1d3319);border:1px solid var(--line,#22301f);border-bottom-left-radius:4px}'+
  '#omModal .chatbar{display:flex;gap:8px;align-items:flex-end}#omModal .chatbar textarea{min-height:44px;max-height:110px;flex:1}#omModal .chatbar button{padding:0 18px;height:44px;border:0;border-radius:4px;background:var(--gold,#b58a50);color:#07090c;font:inherit;cursor:pointer}'+
  '#omModal .empty{margin:auto;color:var(--muted,#a9a592);text-align:center;font-size:14px;padding:10px}'+
  '@media (prefers-reduced-motion:reduce){#menuPanel,#omModal .bx,.mbtn span,#omModal .m{transition:none!important;animation:none!important}}';
  var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);

  /* ───────── القائمة ───────── */
  var back=document.createElement('div');back.id='menuBack';
  var panel=document.createElement('nav');panel.id='menuPanel';panel.setAttribute('aria-label','القائمة');
  panel.innerHTML=
    '<button type="button" data-act="support"><span class="ic">💬</span>الدعم<span class="bd" id="menuBd">1</span></button>'+
    '<button type="button" data-act="orders"><span class="ic">📦</span>طلباتي</button>'+
    '<button type="button" data-act="data"><span class="ic">👤</span>بياناتي</button>'+
    '<button type="button" data-act="review"><span class="ic">⭐</span>رأيك</button>'+
    '<a href="privacy.html"><span class="ic">🔒</span>سياسة الخصوصية</a>';
  var modal=document.createElement('div');modal.id='omModal';modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');
  modal.innerHTML='<div class="bx"><div class="hd"><h3 id="omT"></h3><button type="button" class="x" id="omX" aria-label="إغلاق">✕</button></div><div class="bd2" id="omB"></div></div>';
  var btn=null,onClose=null;
  function menuOpen(v){
    if(!btn)return;
    btn.classList.toggle('open',v);btn.setAttribute('aria-expanded',v?'true':'false');
    panel.classList.toggle('on',v);back.classList.toggle('on',v);
  }
  function openModal(title,html,after,closer){
    menuOpen(false);
    $('omT').textContent=title;$('omB').innerHTML=html;onClose=closer||null;
    modal.classList.add('on');if(after)after();
  }
  function closeModal(){modal.classList.remove('on');if(onClose){try{onClose()}catch(e){}onClose=null}}

  function init(){
    btn=$('menuBtn');if(!btn)return;
    document.body.appendChild(back);document.body.appendChild(panel);document.body.appendChild(modal);
    if(!$('menuDot')){var d=document.createElement('i');d.className='mdot';d.id='menuDot';btn.appendChild(d)}
    btn.addEventListener('click',function(){menuOpen(!panel.classList.contains('on'))});
    back.addEventListener('click',function(){menuOpen(false)});
    panel.addEventListener('click',function(e){
      var b=e.target.closest&&e.target.closest('[data-act]');if(!b)return;
      var a=b.getAttribute('data-act');
      if(a==='support')openSupport();else if(a==='data')openData();else if(a==='review')openReview();else if(a==='orders')openOrders();
    });
    $('omX').onclick=closeModal;
    modal.addEventListener('click',function(e){if(e.target===modal)closeModal()});
    document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeModal();menuOpen(false)}});
    pollUnread();setInterval(pollUnread,45000);
    if(/[?&]support=1/.test(location.search))setTimeout(openSupport,700);
  }

  /* ───────── بياناتي ───────── */
  function openData(){
    var c=jget(CK,{});
    openModal('بياناتي',
      '<p class="t">سجّل بياناتك مرة وحدة، وتتعبأ تلقائياً عند الطلب وتُستخدم بالدعم.</p>'+
      '<label class="f"><span>الاسم الكامل</span><input id="dN" maxlength="60" autocomplete="name" value="'+esc(c.name||'')+'"></label>'+
      '<label class="f"><span>رقم الهاتف</span><input id="dP" type="tel" inputmode="tel" dir="ltr" placeholder="07XXXXXXXXX" style="text-align:right" autocomplete="tel" value="'+esc(c.phone||'')+'"></label>'+
      '<div class="two"><label class="f"><span>المحافظة</span><select id="dV"><option value="">اختر</option>'+PROVS.map(function(x){return '<option'+(x===c.prov?' selected':'')+'>'+x+'</option>'}).join('')+'</select></label>'+
      '<label class="f"><span>اختر</span><select id="dA"><option value="">اختر</option>'+['مركز المحافظة','قضاء'].map(function(x){return '<option'+(x===c.area?' selected':'')+'>'+x+'</option>'}).join('')+'</select></label></div>'+
      '<label class="f"><span>أقرب نقطة دالة / العنوان</span><input id="dD" maxlength="200" value="'+esc(c.addr||'')+'"></label>'+
      '<button class="pb" id="dS">حفظ بياناتي</button><p class="ms" id="dM" role="status"></p>',
      function(){
        $('dS').onclick=function(){
          var n=$('dN').value.trim(),ph=normPhone($('dP').value);
          if(!n)return msg('dM','اكتب اسمك.',1);
          if(!ph)return msg('dM','رقم الهاتف غير صحيح (مثال 07712345678).',1);
          if(!$('dV').value)return msg('dM','اختر المحافظة.',1);
          if(!$('dA').value)return msg('dM','اختر مركز المحافظة أو قضاء.',1);
          if($('dD').value.trim().length<3)return msg('dM','اكتب العنوان / أقرب نقطة دالة.',1);
          jset(CK,{name:n,phone:ph,prov:$('dV').value,area:$('dA').value,addr:$('dD').value.trim()});
          try{rpc('save_customer',{p_name:n,p_phone:ph,p_province:$('dV').value,p_area:$('dA').value,p_address:$('dD').value.trim()}).catch(function(){})}catch(e){}
          msg('dM','✓ تم حفظ بياناتك على هذا الجهاز.',0,1);
        };
      });
  }
  /* ───────── طلباتي ───────── */
  function openOrders(){
    var OK='orris_my_orders';
    var ORD=['pending','received','delivered'];
    var STT={
      pending:{n:'في انتظار القبول',c:'#d9a441',d:'وصلنا طلبك وننتظر موافقة الإدارة عليه. أول ما يتقبل يبدأ تجهيزه.'},
      received:{n:'جاري تجهيز الطلب',c:'#4f8ef7',d:'تم قبول طلبك وهسه نجهّزه ونغلّفه حتى يطلع للتوصيل.'},
      delivered:{n:'تم التوصيل',c:'#3fb86f',d:'وصل طلبك لعنوانك. نتمنى يعجبك، وشاركنا رأيك 🌿'}
    };
    function saved(){var a=jget(OK,[]);return Array.isArray(a)?a:[]}
    function fetchOne(x){
      return rpc('track_order',{p_code:x.code,p_phone:x.phone}).then(function(r){return r&&r.found?r:null}).catch(function(){return undefined});
    }
    function steps(st){
      var at=ORD.indexOf(st);
      return '<div style="display:flex;align-items:flex-start;margin:12px 0 10px">'+ORD.map(function(k,i){
        var on=i<=at,s=STT[k];
        return '<div style="flex:1;text-align:center;position:relative">'+
          (i?'<span style="position:absolute;top:13px;right:50%;width:100%;height:2px;background:'+(i<=at?STT[ORD[i]].c:'rgba(255,255,255,.12)')+'"></span>':'')+
          '<span style="position:relative;display:inline-flex;width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:'+(on?s.c:'var(--bg,#07090c)')+';border:2px solid '+(on?s.c:'rgba(255,255,255,.2)')+';color:'+(on?'#07090c':'var(--muted,#a9a592)')+'">'+(i<at?'✓':(i+1))+'</span>'+
          '<div style="font-size:11px;margin-top:5px;color:'+(on?'var(--cream,#efe6d2)':'var(--muted,#a9a592)')+'">'+s.n+'</div></div>';
      }).join('')+'</div>';
    }
    function card(r){
      var s=STT[r.status]||STT.pending;
      var items=(r.items||[]).map(function(i){return '<li>'+esc(i.name)+' — '+esc(i.size)+' × '+esc(String(i.qty))+'</li>'}).join('');
      var dt='';try{dt=new Date(r.date).toLocaleDateString('ar',{day:'numeric',month:'long'})}catch(e){}
      return '<div style="border:1px solid var(--line,#22301f);border-right:4px solid '+s.c+';border-radius:8px;padding:12px 14px;margin-bottom:12px;background:rgba(255,255,255,.02)">'+
        '<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;color:var(--muted,#a9a592)">رمز الطلب'+(dt?' · '+esc(dt):'')+'</span><b dir="ltr" style="letter-spacing:2px;color:var(--gold,#b58a50);font-size:18px">'+esc(r.code)+'</b></div>'+
        steps(r.status)+
        '<p style="margin:0 0 8px;font-size:14px;line-height:1.8"><b style="color:'+s.c+'">'+s.n+':</b> '+s.d+'</p>'+
        '<ul style="margin:0 0 8px;padding:0 18px;font-size:14px;line-height:1.9;color:var(--muted,#a9a592)">'+items+'</ul>'+
        '<div style="font-size:14px">الإجمالي: <b>'+esc(String(r.total))+'</b> '+esc(r.currency||'دينار')+'</div></div>';
    }
    function legend(){
      return '<div style="margin-top:6px;padding-top:12px;border-top:1px dashed var(--line,#22301f)"><div style="font-size:14px;margin-bottom:8px;color:var(--gold,#b58a50)">شنو تعني كل حالة؟</div>'+
        ORD.map(function(k){var s=STT[k];return '<div style="display:flex;gap:8px;font-size:13px;line-height:1.7;margin-bottom:6px;color:var(--muted,#a9a592)"><i style="flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px;background:'+s.c+'"></i><span><b style="color:var(--cream,#efe6d2)">'+s.n+':</b> '+s.d+'</span></div>'}).join('')+'</div>';
    }
    function showAll(){
      var list=saved(),L=$('oL');if(!L)return;
      if(!list.length){L.innerHTML='<div style="text-align:center;padding:26px 6px"><div style="font-size:34px">📦</div><p style="margin:8px 0 4px;font-size:17px">ما عندك طلبات بعد</p><p class="t" style="margin:0">أول ما تطلب يظهر طلبك هنا وتتابع حالته.<br>تظهر هنا الطلبات اللي سوّيتها من هذا الجهاز.</p></div>'+legend();return}
      L.innerHTML='<p class="t">جارٍ التحميل…</p>';
      Promise.all(list.map(fetchOne)).then(function(rs){
        var ok=rs.filter(function(r){return r}),fail=rs.some(function(r){return r===undefined});
        if(!$('oL'))return;
        $('oL').innerHTML=(ok.length?ok.map(card).join(''):'<p class="t">'+(fail?'تعذّر تحميل طلباتك حالياً، اضغط تحديث.':'ما لقينا طلباتك.')+'</p>')+legend();
      });
    }
    openModal('📦 طلباتي',
      '<p class="t" style="text-align:center">هنا تشوف حالة طلباتك، والحالة تتحدث تلقائياً من الإدارة.</p><div id="oL"></div>'+
      '<div style="display:flex;gap:10px;margin-top:14px"><button class="pb" id="oR" style="flex:2">🔄 تحديث</button><button class="sb" id="oX" style="flex:1;margin-top:0">إغلاق</button></div>',
      function(){$('oR').onclick=showAll;$('oX').onclick=closeModal;showAll()});
  }
  function msg(id,t,bad,ok){var m=$(id);if(!m)return;m.textContent=t;m.className='ms'+(bad?' bad':ok?' ok':'')}

  /* ───────── رأيك ───────── */
  function openReview(){
    var gender='';
    openModal('رأيك',
      '<div class="rvl" id="rL"><p class="t" style="margin:0">جارٍ تحميل الآراء…</p></div>'+
      '<label class="f"><span>اسمك (الاسم الأول فقط)</span><input id="rN" maxlength="20" autocomplete="off" value="'+esc((jget(CK,{}).name||'').split(' ')[0])+'"></label>'+
      '<div class="gs" id="rG"><button type="button" data-g="girl">👩 أنثى</button><button type="button" data-g="man">👨 ذكر</button></div>'+
      '<label class="f"><span>رأيك بالمتجر والعطور</span><textarea id="rB" maxlength="300" placeholder="اكتب رأيك هنا…"></textarea></label>'+
      '<button class="pb" id="rS">إرسال الرأي</button><p class="ms" id="rM" role="status"></p>',
      function(){
        function load(){
          rpc('approved_reviews').then(function(rows){
            $('rL').innerHTML=(Array.isArray(rows)&&rows.length)?rows.map(function(r){return '<div class="rv1"><b>'+(r.gender==='man'?'👨 ':'👩 ')+esc(r.name)+'</b><p>'+esc(r.body)+'</p></div>'}).join(''):'<p class="t" style="margin:0">كن أول من يكتب رأيه 🌿</p>';
          }).catch(function(){$('rL').innerHTML='<p class="t" style="margin:0">تعذّر تحميل الآراء.</p>'});
        }
        load();
        $('rG').onclick=function(e){var g=e.target.getAttribute('data-g');if(!g)return;gender=g;Array.prototype.forEach.call(this.children,function(b){b.className=b.getAttribute('data-g')===g?'on':''})};
        $('rS').onclick=function(){
          var n=$('rN').value.trim(),b=$('rB').value.trim();
          if(!n)return msg('rM','اكتب اسمك.',1);
          if(!gender)return msg('rM','اختر أنثى أو ذكر.',1);
          if(b.length<3)return msg('rM','الرأي لازم يكون بين 3 و300 حرف.',1);
          var tk=rid(16),me=this;me.disabled=true;msg('rM','جارٍ الإرسال…');
          rpc('submit_review',{p_name:n,p_body:b,p_gender:gender,p_token:tk}).then(function(r){
            var E={name:'اكتب اسمك.',gender:'اختر أنثى أو ذكر.',body:'الرأي لازم يكون بين 3 و300 حرف.',link:'ممنوع وضع روابط بالرأي.',busy:'عدد الآراء كثير حالياً، حاول بعد قليل.'};
            if(!r||!r.ok)return msg('rM',E[r&&r.error]||'تعذّر إرسال الرأي.',1);
            if(r.status==='approved'){msg('rM','🎉 تم نشر رأيك، شكراً لك!',0,1);load()}
            else if(r.status==='rejected'){msg('rM','عذراً، رأيك لم يُنشر. السبب: '+(r.reason||'غير محدد'),1)}
            else{var a=jget(TK,[]);a.push(tk);jset(TK,a.slice(-20));msg('rM','وصلنا رأيك وهو قيد المراجعة، وراح نبلغك بالنتيجة 🌿',0,1)}
            $('rB').value='';
          }).catch(function(){msg('rM','تعذّر إرسال الرأي، حاول لاحقاً.',1)}).then(function(){me.disabled=false});
        };
      });
  }

  /* ───────── الدعم ───────── */
  var poll=null,lastId=0,seen={};
  function chatId(){var c=localStorage.getItem(CID);if(!c||c.length<16){c=rid(16);try{localStorage.setItem(CID,c)}catch(e){}}return c}
  function setUnread(n){
    var on=n>0;
    var d=$('menuDot');if(d)d.classList.toggle('on',on);
    var b=$('menuBd');if(b){b.textContent=n>9?'9+':n;b.classList.toggle('on',on)}
  }
  function pollUnread(){
    if(!localStorage.getItem(CID)||modal.classList.contains('on'))return;
    rpc('support_unread',{p_chat:localStorage.getItem(CID)}).then(function(n){setUnread(parseInt(n)||0)}).catch(function(){});
  }
  function bubble(m){
    var t='';try{t=new Date(m.at).toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'})}catch(e){}
    return '<div class="m '+(m.sender==='admin'?'a':'u')+'">'+esc(m.body)+'<small>'+(m.sender==='admin'?'الدعم · ':'')+esc(t)+'</small></div>';
  }
  function addMsgs(rows,box){
    var add='';
    rows.forEach(function(m){if(seen[m.id])return;seen[m.id]=1;if(m.id>lastId)lastId=m.id;add+=bubble(m)});
    if(add){var e=box.querySelector('.empty');if(e)e.remove();box.insertAdjacentHTML('beforeend',add);box.scrollTop=box.scrollHeight}
  }
  function openSupport(){
    var c=jget(CK,{}),ph=normPhone(c.phone);
    if(!c.name||!ph){
      openModal('الدعم','<p class="t">لازم تسجّل بياناتك (الاسم ورقم الهاتف) قبل ما تراسل الدعم.</p><button class="pb" id="goData">تسجيل بياناتي</button>',function(){$('goData').onclick=openData});
      return;
    }
    if(window.OrrisPush&&!OrrisPush.allowed()){
      OrrisPush.ensure(chatId()).then(function(ok){
        if(ok)openSupport();
        else openModal('الدعم','<p class="t">حتى تراسل الدعم لازم تفعّل إشعارات الموقع، حتى توصلك ردودنا فوراً.<br>فعّلها من إعدادات المتصفح (🔒 جنب رابط الموقع ← الإشعارات ← سماح) وبعدها حدّث الصفحة.</p><button class="pb" id="pnRetry">حاول مرة ثانية</button>',function(){$('pnRetry').onclick=openSupport});
      });
      return;
    }
    var cid=chatId();lastId=0;seen={};if(window.OrrisPush)OrrisPush.ensure(cid);
    openModal('الدعم',
      '<div class="chat" id="cB"><div class="empty">اكتب رسالتك وراح نرد عليك بأقرب وقت 💬</div></div>'+
      '<div class="chatbar"><textarea id="cI" rows="1" maxlength="1000" placeholder="اكتب رسالتك…"></textarea><button id="cS">إرسال</button></div><p class="ms" id="cM" role="status"></p>',
      function(){
        var box=$('cB');
        function fetchNew(first){
          rpc('support_fetch',{p_chat:cid,p_after:lastId,p_mark:true}).then(function(rows){
            if(Array.isArray(rows))addMsgs(rows,box);setUnread(0);
          }).catch(function(){if(first)msg('cM','الدعم غير متاح حالياً.',1)});
        }
        fetchNew(true);
        poll=setInterval(function(){fetchNew(false)},5000);
        function send(){
          var t=$('cI').value.trim();if(!t)return;
          var b=$('cS');b.disabled=true;msg('cM','');
          rpc('support_send',{p_chat:cid,p_name:c.name,p_phone:ph,p_body:t}).then(function(){
            $('cI').value='';fetchNew(false);if(window.OrrisPush)OrrisPush.notifyAdmin(cid);
          }).catch(function(e){
            var m=String(e&&e.message||'');
            msg('cM',/rate/i.test(m)?'أرسلت رسائل كثيرة، انتظر قليلاً.':/register/i.test(m)?'سجّل بياناتك أولاً.':/busy/i.test(m)?'الضغط عالي، حاول بعد قليل.':'تعذّر الإرسال، حاول لاحقاً.',1);
          }).then(function(){b.disabled=false});
        }
        $('cS').onclick=send;
        $('cI').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
      },
      function(){clearInterval(poll);poll=null});
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();

</script>
<script>
var PRODUCTS=[], CATS=["الكل"], cat="الكل", cart={}, selSize={}, closed=false;
try{var s0=localStorage.getItem("orris_cart2");if(s0)cart=JSON.parse(s0)||{}}catch(e){}
function save(){try{localStorage.setItem("orris_cart2",JSON.stringify(cart))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function num(v){var n=parseFloat(String(v||"").replace(/[^0-9.]/g,""));return isNaN(n)?0:n}
function fmt(n){return Math.round(n).toLocaleString("en-US")}
var BADGES={bestseller:"⭐ الأكثر مبيعاً",limited:"🔥 محدود",soldout:"🚫 نفذ"};

// تحويل بيانات اللوحة إلى منتجات للمتجر
function norm(arr){
  return (Array.isArray(arr)?arr:[]).filter(function(p){return p&&p.name}).map(function(p,i){
    var sz=[];
    if(Array.isArray(p.sizes)&&p.sizes.length){
      p.sizes.forEach(function(x){if(x&&x.size)sz.push({label:String(x.size),price:num(x.price),old:num(x.oldPrice)})});
    }else{   // عطور محفوظة بالطريقة القديمة
      if(p.size||num(p.price))sz.push({label:String(p.size||"50ml"),price:num(p.price),old:num(p.oldPrice)});
      if(num(p.price30)>0)sz.push({label:"30ml",price:num(p.price30),old:num(p.oldPrice30)});
    }
    if(!sz.length)sz.push({label:"50ml",price:0,old:0});
    return {i:i,name:String(p.name),en:p.nameEn||"",cat:p.type||"للجنسين",types:(Array.isArray(p.types)&&p.types.length)?p.types:(p.type==="للجنسين"||!p.type?["رجالي","نسائي"]:[p.type]),cur:p.currency||"دينار",sz:sz,
      badge:p.badge||"",img:/^(data:image\/|https?:\/\/)/.test(p.image||"")?p.image:"",desc:p.description||""};
  });
}
function size(p){return selSize[p.i]||""}
function sizesOf(p){return p.sz.map(function(x){return {v:x.label,label:x.label,price:x.price,old:x.old}})}
function entry(p,sz){return p.sz.filter(function(x){return x.label===sz})[0]}
function labelOf(p,sz){var e=entry(p,sz);return e?e.label:""}
function priceOf(p,sz){var e=entry(p,sz);return e?e.price:(p.sz[0]?p.sz[0].price:0)}
function oldOf(p,sz){var e=entry(p,sz);return e?e.old:(p.sz[0]?p.sz[0].old:0)}
function key(p,sz){return p.name+"||"+sz}
function chips(){
  $("chips").innerHTML=CATS.map(function(c){return '<button class="chip'+(c===cat?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join("");
}
function grid(){
  if(closed){$("grid").innerHTML='<p class="state" style="grid-column:1/-1">المتجر مغلق حالياً، نعود قريباً 🌿</p>';return}
  var list=PRODUCTS.filter(function(p){return cat==="الكل"||p.cat===cat});
  if(!list.length){$("grid").innerHTML='<p class="state" style="grid-column:1/-1">لا توجد عطور حالياً.</p>';return}
  $("grid").innerHTML=list.map(function(p){
    var sz=size(p),k=key(p,sz),pr=priceOf(p,sz),old=oldOf(p,sz),so=p.badge==="soldout";
    var img=p.img?'<div class="pimg"><img src="'+esc(p.img)+'" alt="'+esc(p.name)+'" loading="lazy"></div>':'<div class="bottle"><i></i></div>';
    var bd=BADGES[p.badge]?'<span class="badge'+(so?' so':'')+'">'+BADGES[p.badge]+'</span>':'';
    var sizes='<button class="szbtn'+(sz?' set':'')+'" data-szopen="'+p.i+'">'+(sz?'الحجم: '+esc(labelOf(p,sz))+' ✓ (تغيير)':'نوع الحجم')+'</button>';
    var price=pr?'<div class="price">'+(old>pr?'<s>'+fmt(old)+'</s>':'')+fmt(pr)+' '+esc(p.cur)+'</div>':'';
    var act=so?'<button class="add" disabled>نفذ</button>':(sz&&cart[k]?'<div class="step"><button data-gm="'+esc(k)+'" aria-label="نقص">−</button><span>'+cart[k]+'</span><button data-gp="'+esc(k)+'" aria-label="زيادة">+</button></div>':'<button class="add" data-add="'+p.i+'">أضف إلى السلة</button>');
    return '<div class="card">'+img+bd+'<h3>'+esc(p.name)+'</h3>'+(p.en?'<small style="direction:ltr;text-align:right">'+esc(p.en)+'</small>':'')+'<small>'+esc(p.types.join(' • '))+'</small>'+(p.desc?'<p class="desc">'+esc(p.desc)+'</p>':'')+price+(so?'':sizes+'<div class="szerr"></div>')+act+'</div>';
  }).join("");
}
function find(k){var n=k.split("||")[0];return PRODUCTS.filter(function(x){return x.name===n})[0]}
$("chips").addEventListener("click",function(e){var c=e.target.getAttribute("data-c");if(c){cat=c;chips();grid()}});
$("grid").addEventListener("click",function(e){
  var t=e.target,a=t.getAttribute("data-add"),gp=t.getAttribute("data-gp"),gm=t.getAttribute("data-gm"),o=t.getAttribute("data-szopen");
  if(o!==null){openSz(+o);return}
  if(a!==null){
    var p=PRODUCTS[a];if(!p)return;
    if(!size(p)){
      var card=t.closest(".card"),er=card&&card.querySelector(".szerr"),b=card&&card.querySelector(".szbtn");
      if(er)er.textContent="⚠️ اختر نوع الحجم أولاً";
      if(b){b.classList.remove("err");void b.offsetWidth;b.classList.add("err")}
      return;
    }
    cart[key(p,size(p))]=1;
  }
  if(gp)cart[gp]++;
  if(gm){cart[gm]--;if(cart[gm]<=0)delete cart[gm]}
  if(a!==null||gp||gm){save();draw()}
});
// ══ نافذة نوع الحجم ══
var szCur=-1,szTmp="";
function renderSz(){
  var p=PRODUCTS[szCur];if(!p)return;
  $("szTitle").textContent=p.name;
  $("szOpts").innerHTML=sizesOf(p).map(function(x){
    return '<button class="szopt'+(szTmp===x.v?' on':'')+'" data-v="'+x.v+'"><span>'+esc(x.label)+(szTmp===x.v?' ✓':'')+'</span><span>'+(x.old>x.price&&x.price?'<s>'+fmt(x.old)+'</s>':'')+(x.price?'<b>'+fmt(x.price)+' '+esc(p.cur)+'</b>':'')+'</span></button>';
  }).join("");
  $("szDone").disabled=!szTmp;
}
function openSz(i){szCur=i;szTmp=selSize[i]||"";renderSz();$("szModal").className="on"}
function closeSz(){$("szModal").className="";szCur=-1;szTmp=""}   // الإغلاق بدون «تم» = ما ينحفظ شي
$("szOpts").addEventListener("click",function(e){var b=e.target.closest(".szopt");if(!b)return;szTmp=b.getAttribute("data-v");renderSz()});
$("szDone").onclick=function(){if(!szTmp||szCur<0)return;selSize[szCur]=szTmp;closeSz();grid()};
$("szClose").onclick=closeSz;
$("szModal").addEventListener("click",function(e){if(e.target===this)closeSz()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSz()});

// ══ السلة والطلب ══
var PROVS=["بغداد","البصرة","نينوى","أربيل","النجف","كربلاء","ذي قار","الأنبار","ديالى","كركوك","صلاح الدين","بابل","ميسان","المثنى","القادسية","واسط","السليمانية","دهوك","حلبجة"];
var view="cart", coupon=null, notes="", cpOpen=false, cpMsg="", cpVal="", busy=false, lastTotal=0;
var info={name:"",phone:"",prov:"",area:"",addr:""};
try{var si=JSON.parse(localStorage.getItem("orris_cust")||"null");if(si&&typeof si==="object")info=Object.assign(info,si)}catch(e){}

function lines(){
  var a=[];
  Object.keys(cart).forEach(function(k){
    var p=find(k);if(!p)return;var sz=k.split("||")[1];if(!entry(p,sz))return;
    a.push({k:k,p:p,sz:sz,qty:cart[k],unit:priceOf(p,sz),old:oldOf(p,sz)});
  });
  return a;
}
function calc(){
  var L=lines(),sub=0,cur="دينار";
  L.forEach(function(l){sub+=l.unit*l.qty;cur=l.p.cur});
  var disc=0;
  var qn=L.reduce(function(a,l){return a+l.qty},0);
  if(coupon&&sub&&qn>=2){disc=coupon.type==="percent"?Math.round(sub*coupon.value/100):coupon.value;disc=Math.max(0,Math.min(disc,sub))}
  return {L:L,sub:sub,disc:disc,total:sub-disc,cur:cur,n:L.reduce(function(a,l){return a+l.qty},0)};
}
function countUp(el,to){
  if(!el)return;var from=lastTotal,t0=null;lastTotal=to;
  if(from===to||window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=fmt(to);return}
  (function step(ts){if(!t0)t0=ts;var r=Math.min((ts-t0)/380,1);el.textContent=fmt(from+(to-from)*r);if(r<1)requestAnimationFrame(step)})(performance.now?performance.now():0);
}
function setSteps(n){
  var b=$("steps").querySelectorAll("b"),i=$("steps").querySelectorAll("i");
  for(var x=0;x<3;x++)b[x].className=x<n?"on":"";
  for(x=0;x<2;x++)i[x].className=x<n-1?"on":"";
}
function show(v){
  view=v;["Cart","Info","Done"].forEach(function(n){$("v"+n).className="view2"+(("v"+n)==="v"+v.charAt(0).toUpperCase()+v.slice(1)?" on":"")});
  setSteps(v==="cart"?1:v==="info"?2:3);
}
function cartView(){
  var c=calc();
  if(!c.L.length){
    $("cartBody").innerHTML='<div class="cempty"><div class="fb"></div><p>سلتك فارغة، أضف عطراً يعجبك</p><button class="btn fill" id="browse">تصفح العطور</button></div>';
    $("cartFoot").innerHTML="";return;
  }
  var h=c.L.map(function(l,i){
    return '<div class="citem" style="animation-delay:'+(i*60)+'ms"><div class="cbot"><i></i></div><div class="cmeta"><h3>'+esc(l.p.name)+'</h3><span class="chip2">'+esc(l.sz)+'</span><small>'+(l.unit?fmt(l.unit)+' '+esc(l.p.cur):'')+'</small></div>'+
      '<div class="cside"><div class="cstep"><button data-m="'+esc(l.k)+'" aria-label="نقص">−</button><span>'+l.qty+'</span><button data-p="'+esc(l.k)+'" aria-label="زيادة">+</button></div><span class="cline">'+fmt(l.unit*l.qty)+'</span><button class="crm" data-rm="'+esc(l.k)+'">حذف</button></div></div>';
  }).join("");
  h+=coupon
    ? '<div class="ticket"><div class="tk-ok"><span>🏷️ تم تطبيق الكود <b dir="ltr">'+esc(coupon.code)+'</b></span><button id="cpRm">إزالة</button></div>'+(c.n<2?'<p class="tk-msg">الخصم يشتغل عند طلب عطرين أو أكثر.</p>':'')+'</div>'
    : '<div class="ticket'+(cpOpen?' open':'')+'"><button class="tk-h" id="cpToggle"><span>🎟️ عندك كود خصم؟</span><span>⌄</span></button><div class="tk-b"><div class="tk-row"><input id="cpIn" maxlength="30" placeholder="CODE" autocomplete="off" value="'+esc(cpVal)+'"><button id="cpApply">تطبيق</button></div><p class="tk-msg" id="cpMsg">'+esc(cpMsg)+'</p></div></div>';
  h+='<label class="fld"><span>ملاحظات إضافية <em>(اختياري)</em></span><textarea id="notesIn" maxlength="300" placeholder="اكتب ملاحظتك هنا إن أردت…">'+esc(notes)+'</textarea></label>';
  $("cartBody").innerHTML=h;
  $("cartFoot").innerHTML='<div class="sum">'+(c.disc?'<div><span>المجموع</span><span>'+fmt(c.sub)+' '+esc(c.cur)+'</span></div><div class="dis"><span>خصم الكود</span><span>− '+fmt(c.disc)+'</span></div>':'')+'<div class="tot"><span>الإجمالي</span><span><b id="totVal">'+fmt(lastTotal)+'</b> '+esc(c.cur)+'</span></div></div><button class="go" id="goInfo">متابعة <span aria-hidden="true">←</span></button>';
  countUp($("totVal"),c.total);
}
function draw(){
  if(PRODUCTS.length){Object.keys(cart).forEach(function(k){var p=find(k);if(!p||!entry(p,k.split("||")[1]))delete cart[k]});save()}
  var c=calc();$("count").textContent=c.n;
  if(view==="cart")cartView();
  grid();
}
function toggle(v){
  $("drawer").className="drawer"+(v?" on":"");$("shade").className="shade"+(v?" on":"");
  if(v){view==="done"?show("cart"):show(view);draw()}
}
$("openCart").onclick=function(){if(view==="done")show("cart");toggle(true)};
$("closeCart").onclick=$("shade").onclick=function(){toggle(false)};
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&$("drawer").className.indexOf("on")>-1)toggle(false)});

$("cartBody").addEventListener("click",function(e){
  var t=e.target,m=t.getAttribute("data-m"),p=t.getAttribute("data-p"),r=t.getAttribute("data-rm");
  if(m){cart[m]--;if(cart[m]<=0)delete cart[m];save();draw();return}
  if(p){cart[p]++;save();draw();return}

    document.addEventListener("keydown",function(e){if(e.key==="Escape")box.classList.remove("on")});
  }
  OrrisCloud.rpc("ai_public").then(function(c){
    if(!c||!c.enabled||!/^https:\/\//i.test(c.proxy||""))return;
    proxy=String(c.proxy).replace(/\/+$/,"");
    build();
    var card=el("aiCard");card.style.display="flex";
    card.onclick=function(){
      var go=function(){box.classList.add("on");setTimeout(function(){inp.focus()},50)};
      if(!window.OrrisPush||OrrisPush.allowed())return go();
      OrrisPush.ensure().then(function(ok){
        if(ok)go();else alert("حتى تستعمل المساعد الشخصي لازم تفعّل إشعارات الموقع.\nفعّلها من إعدادات المتصفح (🔒 جنب رابط الموقع ← الإشعارات ← سماح) وبعدها حدّث الصفحة.");
      });
    };
  }).catch(function(){});
})();
</script>
