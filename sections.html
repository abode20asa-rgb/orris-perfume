<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORRIS | أقسام العطور</title>
<meta name="theme-color" content="#07090c">

<meta property="og:site_name" content="أوريس | ORRIS">
<meta property="og:locale" content="ar_IQ">
<meta property="og:title" content="أقسام عطور أوريس | ORRIS">
<meta property="og:description" content="رجالي ونسائي واقتصادي — اختر قسمك.">
<meta property="og:url" content="https://orris-perfume.vercel.app/sections.html">
<meta property="og:image" content="https://orris-perfume.vercel.app/og-image.png">

<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090c;--surface:#0e1410;--green:#1d3319;--cream:#efe6d2;--muted:#a9a592;--gold:#b58a50;--line:#22301f}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--cream);font-family:'Tajawal',system-ui,sans-serif;font-weight:300;line-height:1.8;min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
a{color:inherit;text-decoration:none}
.wrap{max-width:560px;margin:0 auto;padding:0 20px 40px}
header{text-align:center;padding:22px 0 6px}
.logo{font-family:'Amiri',serif;letter-spacing:.35em;font-size:22px;padding-left:.35em}
.back{display:inline-block;color:var(--muted);margin:8px 0 4px}
h1{font-family:'Amiri',serif;font-weight:400;font-size:32px;text-align:center;margin-top:6px}
.sub{text-align:center;color:var(--muted);margin-bottom:26px}
.opts{display:grid;gap:16px}
.opt{position:relative;display:flex;align-items:center;gap:16px;min-height:118px;padding:20px 22px;border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,.12);transition:transform .2s,border-color .2s}
.opt:hover,.opt:focus-visible{transform:translateY(-3px);border-color:var(--gold);outline:none}
.opt .ic{flex:none;width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:rgba(255,255,255,.1);backdrop-filter:blur(2px)}
.opt h2{font-family:'Amiri',serif;font-weight:700;font-size:28px;line-height:1.3}
.opt p{font-size:14px;opacity:.8}
.opt .ar{margin-right:auto;font-size:22px;opacity:.7}
.men{background:linear-gradient(135deg,#14243a,#223f63)}
.women{background:linear-gradient(135deg,#4a1f33,#8a3a5c)}
.eco{background:linear-gradient(120deg,#d9a441,#e0633a,#c2386b,#6a4bd8,#2b8fd6,#2fb585,#d9a441);background-size:300% 300%;animation:flow 7s ease-in-out infinite;color:#10120f}
.eco p{opacity:.85}.eco .ic{background:rgba(255,255,255,.35)}
@keyframes flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@media (prefers-reduced-motion:reduce){.eco{animation:none}.opt{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><a class="logo" href="index.html">ORRIS</a></header>
  <a class="back" href="index.html">← الرئيسية</a>
  <h1>اختر القسم</h1>
  <p class="sub">وين تريد تتصفح؟</p>
  <div class="opts">
    <a class="opt men" href="shop.html?c=men"><span class="ic">👨</span><span><h2>العطور الرجالية</h2><p>تشكيلة عطور الرجال</p></span><span class="ar">‹</span></a>
    <a class="opt women" href="shop.html?c=women"><span class="ic">👩</span><span><h2>العطور النسائية</h2><p>تشكيلة عطور النساء</p></span><span class="ar">‹</span></a>
    <a class="opt eco" href="shop.html?c=eco"><span class="ic">💰</span><span><h2>العطور الاقتصادية</h2><p>جودة حلوة بسعر خفيف</p></span><span class="ar">‹</span></a>
  </div>
</div>
<script src="supabase-config.js"></script>
<script src="orris-push.js" defer></script>
<script>
(function(){
  if(!window.OrrisCloud)return;
  OrrisCloud.rpc('site_is_open').then(function(o){
    if(o===false)document.body.innerHTML='<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;background:#0a0b0d;color:#f3efe6"><div><div style="font-size:3rem;margin-bottom:20px">🔒</div><h1 style="font-size:2rem;margin-bottom:10px">الموقع مغلق مؤقتاً</h1><p style="color:#a9a592;font-size:1.1rem">يرجى المحاولة لاحقاً</p></div></div>';
  }).catch(function(){});
})();
</script>
</body>
</html>
